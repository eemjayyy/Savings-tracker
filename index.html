<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savings Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EE;--surface:#FFF;--ink:#10231F;--muted:#5E7370;--line:#DCE4E0;--hero:#0E3B33;--hero-ink:#E8F5EE;--lime:#B8F34D;--neg:#C2410C;--pos:#13804F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1412;--surface:#13211E;--ink:#E6F2EE;--muted:#93ABA6;--line:#22362F;--hero:#17493F;--neg:#FF8A50;--pos:#4CD08F}}
:root[data-theme="dark"]{--bg:#0B1412;--surface:#13211E;--ink:#E6F2EE;--muted:#93ABA6;--line:#22362F;--hero:#17493F;--neg:#FF8A50;--pos:#4CD08F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;font-size:16px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar1{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;margin:0}
.eye{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:20px 18px 14px;margin-bottom:16px;--gs:var(--lime)}
.hero small{opacity:.8}.big{display:block;font-size:2.5rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.mo{font-size:.95rem;opacity:.9}.mo.up{color:var(--lime)}
.g{position:relative;margin-top:12px}
.g svg{display:block;touch-action:pan-y;cursor:crosshair}
.g polyline{fill:none;stroke:var(--gs);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g .cur{stroke:var(--gs);stroke-width:1;opacity:.6}.g circle{fill:var(--gs);stroke:var(--surface);stroke-width:2}
.tip{position:absolute;top:-6px;background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.8rem;box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;z-index:2}
.hint{font-size:.8rem;opacity:.75;margin:4px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;min-height:138px;display:flex;flex-direction:column;justify-content:space-between}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);background:transparent}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c) 20%,transparent)}
.tn{display:flex;gap:10px;align-items:center;font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.tb{font-size:1.25rem;font-weight:700}.tt{color:var(--muted);font-size:.82rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px;--gs:var(--pos)}
.card h2{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:4px 0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li .ic{width:36px;height:36px;font-size:1.1rem}.li>div{flex:1;min-width:0}.li .d{color:var(--muted);font-size:.8rem}
.p{color:var(--pos);font-weight:700}.n{color:var(--neg);font-weight:700}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--muted);padding:6px 24px;font-size:.85rem;font-weight:500}
nav button.on{color:var(--pos);font-weight:700}
nav .plus{background:var(--ink);color:var(--bg);border-radius:16px;font-size:1.6rem;line-height:1;padding:10px 22px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sum div{border-radius:16px;padding:12px;text-align:center;font-size:.8rem;font-weight:700}
.sum b{display:block;font-size:1.2rem}
.e{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}.i{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.sel{display:flex;gap:10px;margin-bottom:14px}.sel select{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
dialog{border:0;border-radius:24px 24px 0 0;padding:20px 16px 28px;margin:auto auto 0;width:100%;max-width:560px;background:var(--surface);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-family:'Space Grotesk',sans-serif}
.f{display:flex;flex-direction:column;gap:10px}
.f input,.f select{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg label{text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700}
.seg input{position:absolute;opacity:0}.seg input:checked+span{display:block}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:13px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.msg{color:var(--neg);font-size:.88rem;min-height:1.2em;margin:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--c)}
nav[hidden]{display:none}
.dtop{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:14px}
.dtop h1{font-size:1.1rem;text-align:center}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;line-height:1}
.dh{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px}
.dr{display:flex;gap:14px;align-items:center;margin-bottom:12px}.di{flex:1;min-width:0}.di .tt{display:block;font-size:.95rem}
.ic.big{width:64px;height:64px;border-radius:18px;font-size:2rem;flex:none}
.dbal{font-size:2rem;line-height:1.1;display:block;overflow-wrap:anywhere}
.nwrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.yn{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;border:1px solid var(--line)}
.yn button{border:0;background:none;border-radius:999px;padding:6px 16px;font-weight:500}
.yn button.on{background:var(--lime);color:#10231F;font-weight:700}
.hintbox{background:color-mix(in srgb,var(--lime) 26%,var(--surface));border:1px solid var(--lime);border-radius:18px;padding:12px 14px;text-align:center;font-size:.9rem;margin:0 0 16px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.btn.dark{border-radius:999px;padding:14px 30px}
[hidden]{display:none!important}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.eh h3{margin:0}
.x2{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);font-size:1.4rem}
.ebody{overflow:auto;max-height:calc(88vh - 170px);display:flex;flex-direction:column;gap:14px;padding:2px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted)}
.fl input,.fl select{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);width:100%;font-size:1rem;font-weight:500;color:var(--ink)}
.pf{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--bg)}
.pf i{font-style:normal;font-weight:700;color:var(--ink)}
.pf input{border:0;background:none;padding:14px 0;font-weight:700;font-size:1.1rem;flex:1;width:auto;min-width:0}
.fi{font-size:.85rem;color:var(--muted);margin:-8px 0 0}
.prev{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pv s{color:var(--muted)}.pv b{font-size:1.4rem}.pv em{font-style:normal;font-weight:700;padding:3px 10px;border-radius:999px;font-size:.85rem}
.pv em.up{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}.pv em.dn{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.efoot{display:flex;gap:10px;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--line);margin-top:10px}.efoot .btn{padding:13px 26px;border-radius:999px}
.btn.lime{background:var(--lime);color:#10231F}
.rs{display:flex;gap:6px;flex-wrap:wrap}.rs .chip{padding:5px 12px;font-size:.85rem}
.ic img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ps{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;margin-bottom:6px}
.plist{overflow:auto;max-height:50vh}
.pr{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;text-align:left;font-size:1.05rem;font-weight:500}
.pr .ic,.ph .ic{width:48px;height:48px;border-radius:14px;overflow:hidden;flex:none}
.ph{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--bg);border-radius:18px;padding:16px;font-weight:700;font-size:1.05rem}
.ro{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--muted);font-weight:500}
.cd{margin:auto;width:calc(100% - 48px);max-width:340px;border-radius:30px;padding:24px}
.cd h3{font-size:1.3rem;line-height:1.25;margin:0 0 8px}
.cp{color:var(--muted);margin:0 0 20px}
.cb{display:flex;gap:10px}
.cb .btn.alt{flex:1;border-radius:999px;padding:14px;background:var(--bg);border:0}
.cb .del{color:var(--neg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<dialog id="dlg"></dialog>
<dialog id="cdlg" class="cd"></dialog>

function flat(list){var o=[];list.forEach(function(a){a.tx.forEach(function(t){o.push({ts:t.ts,d:sg(a)*t.amt,amt:t.amt,a:a,t:t});});});return o.sort(function(x,y){return x.ts-y.ts;});}

     +'<div class="chips">'+['All'].concat(accts.map(function(a){return a.type;}).filter(function(t,i,z){return z.indexOf(t)===i;})).map(function(t){return '<button class="chip'+(t===flt?' on':'')+'" data-act="flt" data-t="'+t+'">'+t+'</button>';}).join('')+'</div>'

     +'<section class="card"><h2>Transactions'+(ev.length>6?'<button class="lnk" data-act="all">'+(all?'Show less':'View all')+'</button>':'')+'</h2>'
     +(rec.length?rec.map(function(e){return '<div class="li" style="--c:'+col(e.a)+'"><span class="ic">'+ico(e.a)+'</span><div><b>'+esc(e.t.note||(e.amt>=0?'Deposit':'Withdrawal'))+'</b><br><span class="d">'+esc(e.a.name)+', '+when(e.ts)+'</span></div><span class="num '+(e.amt>=0?'p':'n')+'">'+(e.amt>=0?'+ ':'− ')+m(Math.abs(e.amt))+'</span></div>';}).join(''):'<p class="tt">No entries yet. Tap + to add money to an account.</p>')+'</section>';
    app.innerHTML=h;graph(document.getElementById('g1'),inn);
  }else{
    var list=ins.a==='all'?inn:[get(ins.a)||accts[0]].filter(Boolean),st=new Date();
    if(ins.p==='Day')st.setHours(0,0,0,0);else if(ins.p==='Week'){st.setDate(st.getDate()-6);st.setHours(0,0,0,0);}else if(ins.p==='Month')st=new Date(now.getFullYear(),now.getMonth(),1);else st=new Date(0);
    var pe=flat(list).filter(function(e){return e.ts>=st.getTime();}),inc=0,exp=0;pe.forEach(function(e){if(e.amt>=0)inc+=e.amt;else exp-=e.amt;});
    h='<div class="bar1"><h1>Insights</h1></div><div class="sel"><select data-act="ia" aria-label="Account"><option value="all">All accounts</option>'+accts.map(function(a){return '<option value="'+a.id+'"'+(a.id===ins.a?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select><select data-act="ip" aria-label="Period">'+['Day','Week','Month','All'].map(function(p){return '<option'+(p===ins.p?' selected':'')+' value="'+p+'">'+(p==='All'?'All time':p==='Day'?'Today':p==='Week'?'Last 7 days':'This month')+'</option>';}).join('')+'</select></div>'
     +'<section class="card"><div class="sum"><div class="e">Money out<b class="num">'+m(exp)+'</b></div><div class="i">Money in<b class="num">'+m(inc)+'</b></div></div><p class="tt" style="text-align:center;margin:0">Net '+(inc-exp>=0?'+ ':'− ')+m(Math.abs(inc-exp))+', '+pe.length+(pe.length===1?' entry':' entries')+'</p></section>'
     +'<section class="card"><h2>Growth</h2><div class="g" id="g2"></div></section>';
    app.innerHTML=h;graph(document.getElementById('g2'),list);
  }
}
function sheet(html){dlg.innerHTML=html;if(!dlg.open)dlg.showModal();rs();}
function rs(){var box=document.getElementById('rs'),k=document.querySelector('#dlg input[name=k]:checked');if(!box||!k)return;var L=k.value==='out'?['Bills','Food','Transport','Shopping','Emergency','Other']:['Salary','Allowance','Sale','Gift','Interest','Other'];box.innerHTML=L.map(function(w){return '<button type="button" class="chip" data-act="why" data-w="'+w+'">'+w+'</button>';}).join('');}
function editForm(a){return '<div class="eh"><h3>Edit account</h3><button type="button" class="x2" data-act="close" aria-label="Close">×</button></div><form class="ef" data-form="edit"><div class="ebody">'
+'<label class="fl">Account name<input name="n" maxlength="30" value="'+esc(a.name)+'" required></label>'
+'<label class="fl">Type<select name="t">'+TYPES.concat(TYPES.indexOf(a.type)<0?[a.type]:[]).map(function(t){return '<option'+(t===a.type?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></label>'+'<label class="fl" id="ot"'+(a.type==='Other'?'':' hidden')+'>Other (please specify)<input name="o" maxlength="30" placeholder="Enter account type" pattern=".*[^ ].*"'+(a.type==='Other'?' required':'')+'></label>'
+'<label class="fl">Current balance<span class="pf"><i>₱</i><input name="b" type="number" inputmode="decimal" step="0.01" value="'+bal(a).toFixed(2)+'"></span></label><p class="fi">Only change this if it doesn’t match your bank.</p><label class="fl" id="dsc" hidden>Describe (optional)<input name="d" id="dn" maxlength="60"></label><div class="rs" id="drs" hidden></div>'
+'<label class="fl">Goal amount<span class="pf"><i>₱</i><input name="g" type="number" inputmode="decimal" step="0.01" min="0" value="'+(a.g>0?a.g:'')+'" placeholder="No goal"></span></label>'
+'<label class="fl">Interest rate<span class="pf"><input name="r" type="number" inputmode="decimal" step="0.01" min="0" value="'+(a.r>0?a.r:'')+'" placeholder="0"><i>% p.a.</i></span></label>'
+'<div class="prev" id="prev" hidden></div><p class="hintbox" id="adj" hidden>A balance adjustment entry will be added to correct your account balance. Your existing transactions will remain unchanged.</p>'
+'</div><div class="efoot"><button type="button" class="btn alt" data-act="close">Cancel</button><button class="btn lime">Save</button></div></form>';}
function editFormOld(a){return '<h3>Edit account</h3><form class="f" data-form="edit"><input name="n" maxlength="30" value="'+esc(a.name)+'" aria-label="Account name" required><div style="display:flex;gap:8px"><input name="i" maxlength="2" value="'+esc(a.icon)+'" aria-label="Emoji icon" style="width:84px"><select name="t" aria-label="Type">'+TYPES.map(function(t){return '<option'+(t===a.type?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div><input name="g" type="number" inputmode="decimal" step="0.01" min="0" value="'+(a.g>0?a.g:'')+'" placeholder="Savings goal in ₱ (optional)" aria-label="Savings goal"><button class="btn">Save changes</button><button type="button" class="btn alt" data-act="close">Cancel</button></form>';}
function drender(a){
  var c=col(a),b=bal(a),g=a.g>0?a.g:0,pct=g?Math.min(100,Math.round(b/g*100)):0,inn=a.nw!==false,ev=flat([a]),ti=0,to=0,tx=ev.slice().reverse();
  ev.forEach(function(e){if(e.amt>=0)ti+=e.amt;else to-=e.amt;});
  var rows=dall?tx:tx.slice(0,5);
  app.innerHTML='<div class="dtop"><button class="back" data-act="back" aria-label="Back">‹</button><h1>'+esc(prov(a)?prov(a).n:a.name)+' – '+esc(a.type)+'</h1><span></span></div>'
  +'<section class="dh" style="--c:'+c+'"><div class="dr"><span class="ic big">'+ico(a)+'</span><div class="di"><span class="tt">'+esc(a.name)+'</span><b class="num dbal">'+m(b)+'</b></div><button class="chip" data-act="edit">Edit</button></div>'
  +(g?'<div class="bar"><i style="width:'+pct+'%"></i></div><p class="tt" style="margin:0">'+pct+'% of '+m(g)+' goal'+(b>=g?'. Goal reached!':', '+m(g-b)+' to go')+'</p>':'')
  +(a.r>0?'<p class="tt" style="margin:8px 0 0">'+a.r+'% p.a., about '+m(Math.max(0,b)*a.r/100)+' per year</p>':'')+'<div class="nwrow"><span>Add to total net worth?</span><span class="yn"><button class="'+(inn?'on':'')+'" data-act="nw" data-v="1">Yes</button><button class="'+(inn?'':'on')+'" data-act="nw" data-v="0">No</button></span></div></section>'
  +'<p class="hintbox">To change this balance, tap + and add an entry. Choose <b>Take out</b> to decrease it or <b>Add money</b> to increase it.</p>'
  +'<section class="card"><div class="sum"><div class="i">Money in<b class="num">'+m(ti)+'</b></div><div class="e">Money out<b class="num">'+m(to)+'</b></div></div><h2>Growth</h2><div class="g" id="g3"></div></section>'
  +'<section class="card"><h2>Transactions'+(tx.length>5?'<button class="lnk" data-act="dall">'+(dall?'Show less':'View all')+'</button>':'')+'</h2>'
  +(rows.length?rows.map(function(e){return '<div class="li"><div><b>'+esc(e.t.note||(e.amt>=0?'Deposit':'Withdrawal'))+'</b><br><span class="d">'+when(e.ts)+'</span></div><span class="num '+(e.amt>=0?'p':'n')+'">'+(e.amt>=0?'+ ':'− ')+m(Math.abs(e.amt))+'</span></div>';}).join(''):'<p class="tt">No entries yet. Tap + to add one.</p>')+'</section>'
  +'<div style="text-align:center"><button class="btn dark" data-act="dacc" data-id="'+a.id+'">Delete account</button></div>'
  +'<button class="fab" data-act="newtx" data-id="'+a.id+'" aria-label="Add entry">+</button>';
  graph(document.getElementById('g3'),[a]);
}
function txForm(id){return '<h3>Add entry</h3><form class="f" data-form="tx"><select name="a" aria-label="Account">'+accts.map(function(a){return '<option value="'+a.id+'"'+(a.id===id?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select><div class="seg"><label><input type="radio" name="k" value="in" checked>Add money</label><label><input type="radio" name="k" value="out">Take out</label></div><input name="v" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Amount in ₱" aria-label="Amount" required><label class="fl">Describe (optional)<input name="n" maxlength="60" id="tn" placeholder="Why are you adding or taking out money?" aria-label="Note (optional)"></label><div class="rs" id="rs"></div><p class="msg" id="fm"></p><button class="btn">Save entry</button><button type="button" class="btn alt" data-act="close">Cancel</button></form>';}
function detail(a){var g=a.g>0?a.g:0,b=bal(a),pct=g?Math.min(100,Math.round(b/g*100)):0;
  return '<div style="--c:'+col(a)+'"><div class="tn"><span class="ic">'+esc(a.icon)+'</span>'+esc(a.name)+'</div><p class="tb num" style="margin:8px 0 0;font-size:1.8rem">'+m(b)+'</p><span class="tt">'+a.type+'</span>'
  +(g?'<div class="bar"><i style="width:'+pct+'%"></i></div><p class="tt" style="margin:0">'+pct+'% of '+m(g)+' goal'+(b>=g?'. Goal reached!':', '+m(g-b)+' to go')+'</p>':'')
  +'<div class="f" style="margin:14px 0"><button class="btn" data-act="newtx" data-id="'+a.id+'">Add entry</button><button class="btn alt" data-act="goal" data-id="'+a.id+'">'+(g?'Change goal':'Set a goal')+'</button></div>'
  +a.tx.slice().reverse().map(function(t){return '<div class="li"><div><b>'+esc(t.note||(t.amt>=0?'Deposit':'Withdrawal'))+'</b><br><span class="d">'+when(t.ts)+'</span></div><span class="num '+(t.amt>=0?'p':'n')+'">'+(t.amt>=0?'+ ':'− ')+m(Math.abs(t.amt))+'</span><button class="x" data-act="dtx" data-id="'+a.id+'" data-t="'+t.id+'" aria-label="Delete entry">×</button></div>';}).join('')
  +'<div class="f" style="margin-top:14px"><button class="btn alt" data-act="dacc" data-id="'+a.id+'">Delete account</button><button class="btn alt" data-act="close">Close</button></div></div>';}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;var a=b.dataset.act,d=b.dataset,acc;
  if(a==='view'){view=d.v;render();window.scrollTo(0,0);}
  else if(a==='eye'){hide=!hide;save();render();}
  else if(a==='flt'){flt=d.t;render();}
  else if(a==='all'){all=!all;render();}
  else if(a==='close'){dlg.close();}
  else if(a==='newtx'){if(!accts.length){sheet(acctForm());return;}sheet(txForm(d.id));}
  else if(a==='newacct'){sheet(acctForm());}
  else if(a==='acct'){det=d.id;dall=false;render();window.scrollTo(0,0);}
  else if(a==='pick'){sheet(acctForm2(d.k));}
  else if(a==='acctback'){sheet(acctForm());}
  else if(a==='back'){det=null;render();}
  else if(a==='why'){var tn=document.getElementById(d.to||'tn');if(d.w==='Other'){tn.value='';tn.focus();}else tn.value=d.w;}
  else if(a==='nw'){acc=get(det);acc.nw=d.v==='1';save();render();}
  else if(a==='dall'){dall=!dall;render();}
  else if(a==='edit'){sheet(editForm(get(det)));}
  else if(a==='goal'){acc=get(d.id);var r=prompt('Goal amount in ₱ for '+acc.name+' (leave empty to remove)',acc.g||'');if(r!==null){var n=parseFloat(r);acc.g=n>0?n:0;save();render();}}
  else if(a==='dtx'){acc=get(d.id);acc.tx=acc.tx.filter(function(t){return t.id!==d.t;});save();render();}
  else if(a==='dacc'){var cd=document.getElementById('cdlg');cd.innerHTML='<h3>Do you want to delete this account?</h3><p class="cp">Deleting an account will also delete all of its transaction history.</p><div class="cb"><button type="button" class="btn alt" data-act="dno">Cancel</button><button type="button" class="btn alt del" data-act="dyes" data-id="'+d.id+'">Delete</button></div>';cd.showModal();}
  else if(a==='dno'){document.getElementById('cdlg').close();}
  else if(a==='dyes'){acc=get(d.id);accts=accts.filter(function(x){return x!==acc;});save();det=null;document.getElementById('cdlg').close();render();}
});
function acctForm(){return '<div class="eh"><h3>Add account</h3><button type="button" class="x2" data-act="close" aria-label="Close">\u00d7</button></div><input type="search" id="ps" class="ps" placeholder="Search accounts" aria-label="Search accounts" autocomplete="off"><div class="plist" id="pl">'+PROV.map(function(p){return '<button type="button" class="pr" data-act="pick" data-k="'+p.k+'"><span class="ic" style="--c:'+p.c+'"><img src="'+p.s+'" alt=""></span>'+p.n+'</button>';}).join('')+'<p class="tt" id="pn" hidden style="padding:12px 4px">No accounts match your search.</p></div>';}
function acctForm2(k){var p=PROV.find(function(x){return x.k===k;});return '<div class="eh"><button type="button" class="x2" data-act="acctback" aria-label="Back">\u2039</button><h3>Add account</h3><span style="width:40px"></span></div><form class="ef" data-form="acct"><input type="hidden" name="p" value="'+p.k+'"><div class="ebody"><div class="ph"><span class="ic" style="--c:'+p.c+'"><img src="'+p.s+'" alt=""></span>'+p.n+'</div>'
+'<label class="fl">Account name<input name="n" maxlength="30" placeholder="Daily Expenses" required pattern=".*[^ ].*"></label>'
+'<label class="fl">Type<select name="t">'+TYPES.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></label>'+'<label class="fl" id="ot" hidden>Other (please specify)<input name="o" maxlength="30" placeholder="Enter account type" pattern=".*[^ ].*"></label>'
+'<div class="fl">Starting date<div class="ro">Today, '+new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'})+' (automatic)</div></div>'
+'<label class="fl">Starting balance<span class="pf"><i>\u20b1</i><input name="v" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></span></label></div>'
+'<div class="efoot"><button class="btn lime" style="width:100%">Add account</button></div></form>';}
function acctFormOld(){return '<h3>Add account</h3><form class="f" data-form="acct"><input name="n" maxlength="30" placeholder="Name, like ‘GCash’" aria-label="Account name" required><div style="display:flex;gap:8px"><input name="i" maxlength="2" placeholder="Icon" value="💰" aria-label="Emoji icon" style="width:84px"><select name="t" aria-label="Type">'+TYPES.map(function(t){return '<option'+(t==='Savings'?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div><input name="v" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Starting balance in ₱ (optional)" aria-label="Starting balance"><button class="btn">Add account</button><button type="button" class="btn alt" data-act="close">Cancel</button></form>';}
document.addEventListener('input',function(e){if(e.target.id==='ps'){var q=e.target.value.trim().toLowerCase(),c=0;document.querySelectorAll('#pl .pr').forEach(function(b){var ok=b.textContent.toLowerCase().indexOf(q)>-1;b.hidden=!ok;if(ok)c++;});document.getElementById('pn').hidden=c>0;return;}if(e.target.name!=='b')return;var a=get(det),o=bal(a),nv=parseFloat(e.target.value),box=document.getElementById('prev'),adj=document.getElementById('adj');var ds=document.getElementById('dsc'),dr=document.getElementById('drs');if(isNaN(nv)||Math.round((nv-o)*100)===0){box.hidden=adj.hidden=ds.hidden=dr.hidden=true;return;}var df=nv-o,up=df>0;box.hidden=adj.hidden=ds.hidden=dr.hidden=false;document.getElementById('dn').placeholder=up?'Where did this money come from?':'What was this money spent on?';if(dr.dataset.k!==(up?'in':'out')){dr.dataset.k=up?'in':'out';dr.innerHTML=(up?['Salary','Allowance','Sale','Gift','Interest','Other']:['Bills','Food','Transport','Shopping','Emergency','Other']).map(function(w){return '<button type="button" class="chip" data-act="why" data-to="dn" data-w="'+w+'">'+w+'</button>';}).join('');}box.innerHTML='<b>Balance preview</b><span class="tt">New balance</span><span class="pv"><s>'+m(o)+'</s> <b class="num">'+m(nv)+'</b> <em class="'+(df>0?'up':'dn')+'">'+(df>0?'↑ ':'↓ ')+m(Math.abs(df))+'</em></span>';});
document.addEventListener('change',function(e){var s=e.target;if(s.name==='t'){var ot=document.getElementById('ot');if(ot){ot.hidden=s.value!=='Other';var oi=ot.querySelector('input');oi.required=!ot.hidden;if(!ot.hidden)oi.focus();}}if(s.name==='k')rs();if(s.dataset.act==='ia'){ins.a=s.value;render();}else if(s.dataset.act==='ip'){ins.p=s.value;render();}});
dlg.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,d=new FormData(f),v=parseFloat(d.get('v'));
  if(f.dataset.form==='edit'){var ea=get(det),en=String(d.get('n')).trim();if(!en)return;ea.name=en;ea.icon=String(d.get('i')||'').trim()||ea.icon;ea.type=d.get('t')==='Other'?String(d.get('o')||'').trim()||'Other':d.get('t');var gv=parseFloat(d.get('g'));ea.g=gv>0?gv:0;var rv=parseFloat(d.get('r'));ea.r=rv>0?rv:0;var nb=parseFloat(d.get('b'));if(!isNaN(nb)){var df=Math.round((nb-bal(ea))*100)/100;if(df!==0)ea.tx.push({id:uid(),amt:df,ts:Date.now(),note:String(d.get('d')||'').trim()||'Balance adjustment'});}save();dlg.close();render();return;}
  if(f.dataset.form==='tx'){var a=get(d.get('a'));
    if(!(v>0)){document.getElementById('fm').textContent='Enter an amount greater than 0.';return;}
    v=Math.round(v*100)/100;var out=d.get('k')==='out';
    if(out&&v>bal(a)+0.001&&sg(a)>0){document.getElementById('fm').textContent='That’s more than the balance in '+a.name+'.';return;}
    a.tx.push({id:uid(),amt:out?-v:v,ts:Date.now(),note:String(d.get('n')||'').trim()});
  }else{var pv=PROV.find(function(x){return x.k===d.get('p');});if(!pv)return;var n=String(d.get('n')||'').trim()||pv.n;var na={id:uid(),name:n,p:pv.k,type:(d.get('t')==='Other'?String(d.get('o')||'').trim()||'Other':d.get('t')),icon:'💰',tx:[],g:0};
    if(v>0)na.tx.push({id:uid(),amt:Math.round(v*100)/100,ts:Date.now(),note:'Starting balance'});accts.push(na);}
  save();dlg.close();render();
});
render();
})();
</script>
