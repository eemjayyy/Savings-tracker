<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savings Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EE;--surface:#FFF;--ink:#10231F;--muted:#5E7370;--line:#DCE4E0;--hero:#0E3B33;--hero-ink:#E8F5EE;--lime:#B8F34D;--neg:#C2410C;--pos:#13804F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1412;--surface:#13211E;--ink:#E6F2EE;--muted:#93ABA6;--line:#22362F;--hero:#17493F;--neg:#FF8A50;--pos:#4CD08F}}
:root[data-theme="dark"]{--bg:#0B1412;--surface:#13211E;--ink:#E6F2EE;--muted:#93ABA6;--line:#22362F;--hero:#17493F;--neg:#FF8A50;--pos:#4CD08F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;font-size:16px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.num{font-family:'Montserrat',system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar1{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-family:'Montserrat',sans-serif;font-size:1.4rem;margin:0}
.eye{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:20px 18px 14px;margin-bottom:16px;--gs:var(--lime)}
.hero small{opacity:.8}.big{display:block;font-size:2.5rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.mo{font-size:.95rem;opacity:.9}.mo.up{color:var(--lime)}
.g{position:relative;margin-top:12px}
.g svg{display:block;touch-action:pan-y;cursor:crosshair}
.g polyline{fill:none;stroke:var(--gs);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g .cur{stroke:var(--gs);stroke-width:1;opacity:.6}.g circle{fill:var(--gs);stroke:var(--surface);stroke-width:2}
.tip{position:absolute;top:-6px;background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.8rem;box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;z-index:2}
.hint{font-size:.8rem;opacity:.75;margin:4px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;min-height:138px;display:flex;flex-direction:column;justify-content:space-between}
.tile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);background:transparent}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c) 20%,transparent)}
.tn{display:flex;gap:10px;align-items:center;font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.tb{font-size:1.25rem;font-weight:700}.tt{color:var(--muted);font-size:.82rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px;--gs:var(--pos)}
.card h2{font-family:'Montserrat',sans-serif;font-size:1.1rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:4px 0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li .ic{width:36px;height:36px;font-size:1.1rem}.li>div{flex:1;min-width:0}.li .d{color:var(--muted);font-size:.8rem}
.p{color:var(--pos);font-weight:700}.n{color:var(--neg);font-weight:700}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--muted);padding:6px 24px;font-size:.85rem;font-weight:500}
nav button.on{color:var(--pos);font-weight:700}
nav .plus{background:var(--ink);color:var(--bg);border-radius:16px;font-size:1.6rem;line-height:1;padding:10px 22px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sum div{border-radius:16px;padding:12px;text-align:center;font-size:.8rem;font-weight:700}
.sum b{display:block;font-size:1.2rem}
.e{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}.i{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.sel{display:flex;gap:10px;margin-bottom:14px}.sel select{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
dialog{border:0;border-radius:24px 24px 0 0;padding:20px 16px 28px;margin:auto auto 0;width:100%;max-width:560px;background:var(--surface);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-family:'Montserrat',sans-serif}
.f{display:flex;flex-direction:column;gap:10px}
.f input,.f select{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg label{text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700}
.seg input{position:absolute;opacity:0}.seg input:checked+span{display:block}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:13px;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.msg{color:var(--neg);font-size:.88rem;min-height:1.2em;margin:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--c)}
nav[hidden]{display:none}
.dtop{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:14px}
.dtop h1{font-size:1.1rem;text-align:center}
.back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;line-height:1}
.dh{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px}
.dr{display:flex;gap:14px;align-items:center;margin-bottom:12px}.di{flex:1;min-width:0}.di .tt{display:block;font-size:.95rem}
.ic.big{width:64px;height:64px;border-radius:18px;font-size:2rem;flex:none}
.dbal{font-size:2rem;line-height:1.1;display:block;overflow-wrap:anywhere}
.nwrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.yn{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;border:1px solid var(--line)}
.yn button{border:0;background:none;border-radius:999px;padding:6px 16px;font-weight:500}
.yn button.on{background:var(--lime);color:#10231F;font-weight:700}
.hintbox{background:color-mix(in srgb,var(--lime) 26%,var(--surface));border:1px solid var(--lime);border-radius:18px;padding:12px 14px;text-align:center;font-size:.9rem;margin:0 0 16px}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--ink);color:var(--bg);font-size:2rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.btn.dark{border-radius:999px;padding:14px 30px}
[hidden]{display:none!important}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.eh h3{margin:0}
.x2{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);font-size:1.4rem}
.ebody{overflow:auto;max-height:calc(88vh - 170px);display:flex;flex-direction:column;gap:14px;padding:2px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted)}
.fl input,.fl select{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);width:100%;font-size:1rem;font-weight:500;color:var(--ink)}
.pf{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--bg)}
.pf i{font-style:normal;font-weight:700;color:var(--ink)}
.pf input{border:0;background:none;padding:14px 0;font-weight:700;font-size:1.1rem;flex:1;width:auto;min-width:0}
.fi{font-size:.85rem;color:var(--muted);margin:-8px 0 0}
.prev{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pv s{color:var(--muted)}.pv b{font-size:1.4rem}.pv em{font-style:normal;font-weight:700;padding:3px 10px;border-radius:999px;font-size:.85rem}
.pv em.up{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}.pv em.dn{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.efoot{display:flex;gap:10px;justify-content:flex-end;padding-top:12px;border-top:1px solid var(--line);margin-top:10px}.efoot .btn{padding:13px 26px;border-radius:999px}
.btn.lime{background:var(--lime);color:#10231F}
.rs{display:flex;gap:6px;flex-wrap:wrap}.rs .chip{padding:5px 12px;font-size:.85rem}
.ic img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.ps{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;margin-bottom:6px}
.plist{overflow:auto;max-height:46vh}
.pr{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;text-align:left;font-size:1.05rem;font-weight:500}
.pr .ic,.ph .ic{width:48px;height:48px;border-radius:14px;overflow:hidden;flex:none}
.ph{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--bg);border-radius:18px;padding:16px;font-weight:700;font-size:1.05rem}
.ro{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--muted);font-weight:500}
.cd{margin:auto;width:calc(100% - 48px);max-width:340px;border-radius:30px;padding:24px}
.cd h3{font-size:1.3rem;line-height:1.25;margin:0 0 8px}
.cp{color:var(--muted);margin:0 0 20px}
.cb{display:flex;gap:10px}
.cb .btn.alt{flex:1;border-radius:999px;padding:14px;background:var(--bg);border:0}
.cb .del{color:var(--neg)}
:root{--rd:#D65151;--gn:#46A64F;--rdt:#FDE3E3;--gnt:#DDF6E3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rd:#F0706E;--gn:#5FCB78;--rdt:#3A2323;--gnt:#1E3A2A}}
:root[data-theme="dark"]{--rd:#F0706E;--gn:#5FCB78;--rdt:#3A2323;--gnt:#1E3A2A}
.pill{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px;display:flex;flex-direction:column}
.pill span{font-size:.78rem;color:var(--muted)}
.pill select{border:0;background:none;padding:0;font-weight:700;font-size:1.05rem;width:100%;-webkit-appearance:none;appearance:none;color:var(--ink)}
.sel{display:flex;gap:10px;margin-bottom:14px}
.dn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;text-align:center}
.rb{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--bg);font-size:1.5rem;line-height:1}
.rb:disabled{opacity:.35}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st div{border-radius:18px;padding:14px 8px;text-align:center;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.st b{display:block;font-size:1.2rem;letter-spacing:0;text-transform:none;margin-top:2px}
.xe{background:var(--rdt);color:var(--rd)}.xi{background:var(--gnt);color:var(--gn)}
.nb{text-align:center;margin:14px 0 0;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.nb b{display:block;font-size:2rem;letter-spacing:0;text-transform:none}
.tg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:999px;padding:5px;margin:0 0 14px}
.tg button{border:0;background:none;border-radius:999px;padding:14px;font-weight:700;font-size:1.05rem;color:var(--muted)}
.tg .te.on{background:var(--rd);color:#fff}.tg .ti.on{background:var(--gn);color:#fff}
.tc{border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.th{padding:16px;text-align:center;font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;background:var(--kt);color:var(--k)}
.th b{display:block;font-size:1.8rem;color:var(--ink);letter-spacing:0;text-transform:none;margin-top:2px}
.tb2{padding:14px 16px}
.empty2{text-align:center;color:var(--muted);padding:18px 0;margin:0}
.br{margin:0 0 14px}.br .rw{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.br i{display:block;height:6px;border-radius:3px;margin-top:6px;background:var(--k)}
.full{margin:0 auto;width:100%;max-width:560px;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 28px;background:var(--bg)}
.th2{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:12px}.th2 h2{margin:0;text-align:center;font-family:'Montserrat',sans-serif;font-size:1.3rem}
.tabs{display:flex;gap:4px;background:var(--line);border-radius:999px;padding:5px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:11px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:700}
.tbox{background:color-mix(in srgb,var(--line) 55%,var(--bg));border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:10px}
.tf{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left;width:100%;color:var(--ink)}
.tf b{font-size:.95rem}.tf input{border:0;background:none;padding:2px 0;font-size:1.05rem;width:100%;color:var(--ink)}
.tf .v{color:var(--muted);font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}.tf .v.on{color:var(--ink);font-weight:500}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ac{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid transparent;border-radius:16px;padding:10px 12px;text-align:left;width:100%;color:var(--ink)}
.ac.on{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 22%,var(--surface))}
.ac .ic{width:38px;height:38px;border-radius:11px;overflow:hidden;flex:none}.ac small{color:var(--muted);display:block}
.sl{font-weight:700;margin:6px 4px 0}
.cl{max-height:52vh;overflow:auto}.crow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.crow .cm{flex:1;display:flex;align-items:center;gap:14px;background:none;border:0;padding:14px 8px;text-align:left;font-size:1.05rem}
.cch{width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:1.1rem}
.csub{padding:8px 16px 14px;background:var(--bg)}.csub .sb{display:block;width:100%;text-align:left;padding:12px 8px;background:none;border:0;border-bottom:1px solid var(--line);font-size:1rem}
.dash{display:flex;align-items:center;gap:10px;width:100%;border:1.5px dashed var(--line);border-radius:14px;background:none;padding:12px;font-weight:700;margin-top:8px}
.cf{display:flex;flex-direction:column}.cf button{background:none;border:0;text-align:left;padding:14px 8px;font-size:1.05rem;font-weight:500}
button,.tile,.chip,.ac,.pill{transition:transform .16s cubic-bezier(.3,.7,.4,1),background-color .22s,border-color .22s,box-shadow .22s,opacity .2s}
.tile:active,.ac:active,.pr:active,.pill:active,.li:active{transform:scale(.97)}
.btn:active,.chip:active,.eye:active,.yn button:active,.tabs button:active,.kt button:active,.rb:active,.back:active,.x2:active,.cch:active{transform:scale(.93)}
nav button:active{transform:scale(.9)}
nav .plus:active,.fab:active{transform:scale(.92)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.rise>*{animation:rise .42s cubic-bezier(.2,.8,.3,1) both}
.rise>*:nth-child(2){animation-delay:.05s}.rise>*:nth-child(3){animation-delay:.1s}.rise>*:nth-child(4){animation-delay:.15s}.rise>*:nth-child(5){animation-delay:.2s}.rise>*:nth-child(n+6){animation-delay:.25s}
.rise .tile{animation:pop .45s cubic-bezier(.2,.8,.3,1) both}
.rise .tile:nth-child(2){animation-delay:.08s}.rise .tile:nth-child(3){animation-delay:.12s}.rise .tile:nth-child(4){animation-delay:.16s}.rise .tile:nth-child(5){animation-delay:.2s}.rise .tile:nth-child(n+6){animation-delay:.24s}
.rise .g polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s .2s ease-out forwards}
.rise .bar i{animation:fade .6s both}
dialog[open]{animation:sheet .3s cubic-bezier(.2,.9,.3,1)}
dialog.cd[open]{animation:zoom .24s cubic-bezier(.2,.9,.3,1)}
dialog[open]::backdrop{animation:fade .25s ease}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
.bc{display:block;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px;width:100%;text-align:left;color:var(--ink)}
.bc[data-act]{cursor:pointer}.bc[data-act]:active{transform:scale(.98)}
.bt{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;margin-bottom:8px}
.bl{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:4px 0;text-align:left;color:var(--ink)}.bl>span:nth-child(2){flex:1}.bi{font-size:2rem}.bl i{font-style:normal;font-size:1.6rem}
.bs{display:flex;justify-content:space-between;font-size:.92rem;margin:10px 0 8px}
.dash.big{padding:34px 12px;justify-content:center;flex-direction:column;gap:6px;font-size:1.05rem;border-radius:22px;color:var(--ink)}
.setb{display:flex;align-items:center;justify-content:center;gap:14px;padding:44px 16px;font-size:1.15rem;margin-bottom:16px;width:100%;color:var(--ink)}
.setb .arr{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.bo{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 12px;background:none;border:0;border-left:5px solid transparent;font-size:1.05rem;color:var(--ink);text-align:left}
.bo.on{background:color-mix(in srgb,var(--lime) 22%,var(--surface));border-left-color:var(--lime);font-weight:700}
.ck{width:26px;height:26px;border-radius:50%;background:var(--pos);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.85rem}
.g .gr{stroke:currentColor;opacity:.14;stroke-width:1;stroke-dasharray:3 4}
.g .pt{stroke:none;opacity:.9}
.g .mk{stroke:var(--surface);stroke-width:3}
.fit,.sum b,.th b,.st b,.nb b{white-space:nowrap}
.tb{display:block}
.nwr .big{min-width:0;flex:1;overflow-wrap:normal}
#ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6px);height:28px;display:flex;justify-content:center;align-items:center;pointer-events:none;opacity:0;z-index:20}
.spk{position:relative;width:20px;height:20px}
.spk i{position:absolute;left:50%;top:0;width:2.2px;height:5.5px;margin-left:-1.1px;border-radius:2px;background:var(--muted);opacity:.6;transform-origin:50% 10px}
@keyframes spoke{0%{opacity:.85}100%{opacity:.12}}
#ptr.spin .spk i{animation:spoke .96s linear infinite;animation-delay:calc(var(--n)*.08s - .96s)}
.seeall{display:block;margin:0 auto 16px;background:none;border:0;color:var(--ink);font-weight:600;font-size:1rem;padding:8px 14px}
.seeall span{font-size:1.2rem;margin-left:4px}
.fr{display:flex;gap:8px;align-items:center;margin:0 0 12px}
.chips2{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;--fl:0px;--fr:40px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
.chips2::-webkit-scrollbar{display:none}.chips2 .chip{flex:none}
.vt{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none}
.alist{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.arow{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;color:var(--ink)}
.arow .ic{width:48px;height:48px;border-radius:14px;overflow:hidden;flex:none}
.arow .am{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.arow .am b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .av{font-weight:700;white-space:nowrap}
.arow2{display:flex;justify-content:center;width:100%;margin:0 0 18px;padding:16px;border-radius:20px;color:var(--ink);font-size:1rem}
.ctr{text-align:center;margin:18px 0}.ctr .btn{border-radius:999px;padding:14px 30px}
.ro2{border:1.5px dashed var(--line);border-radius:22px;padding:10px;background:color-mix(in srgb,var(--line) 35%,transparent)}
.ro2 .hold{text-align:center;margin:4px 0 10px;color:var(--muted);font-size:.95rem}.ro2 .grid{margin-bottom:0}
.rt{touch-action:pan-y;cursor:grab}
.rt.ph{background:color-mix(in srgb,var(--line) 70%,var(--surface))}.rt.ph>*{visibility:hidden}
.dragging .rt:not(.ph){opacity:.55}
.ghost{position:fixed;z-index:60;pointer-events:none;margin:0;box-shadow:0 16px 34px rgba(0,0,0,.4);transform:scale(1.05) rotate(1.2deg)}
.tabs.sc{margin:10px 0 8px;scrollbar-width:none}.tabs.sc::-webkit-scrollbar{display:none}.tabs.sc button{flex:none;padding:10px 16px}
.ic .em{font-size:1.35rem;line-height:1}
.pr.addn{color:var(--ink);font-weight:500;border-bottom:0;padding:14px 8px}
.pls{width:48px;display:grid;place-items:center;font-size:1.7rem;color:var(--muted);font-weight:400}
.empt{padding:18px 8px;margin:0}
.eh.af{margin-bottom:12px}
.ttl{display:flex;align-items:center;gap:6px}.ttl h3{margin:0}
.ibtn{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center}
.stk{position:sticky;top:0;z-index:3;background:var(--bg);margin-top:calc(-14px - env(safe-area-inset-top,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:2px}
.pinfo{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .28s ease,opacity .2s ease}.pinfo>div{overflow:hidden}
.stk.info .pinfo{grid-template-rows:1fr;opacity:1}
.pcard{background:color-mix(in srgb,var(--lime) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--lime) 55%,transparent);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:.92rem}.pcard b{display:block;margin-bottom:2px}.pcard p{margin:0;color:var(--muted);line-height:1.5}
.full .plist{max-height:none;overflow:visible}.full .ebody{max-height:none}
.full .efoot{position:sticky;bottom:0;background:var(--bg);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.blurb{margin:4px 2px 8px;color:var(--muted);font-size:.92rem;line-height:1.5}
.prw{border-bottom:1px solid var(--line)}.prl{display:flex;align-items:center}
.prw .pr{border-bottom:0;flex:1;min-width:0;width:auto}
.parr{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.parr svg{transition:transform .28s cubic-bezier(.3,.7,.4,1)}
.prw.open .parr svg{transform:rotate(90deg)}.prw.open .parr{color:var(--ink)}
.pdesc{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s ease,opacity .22s ease}.pdesc>div{overflow:hidden}
.prw.open .pdesc{grid-template-rows:1fr;opacity:1}
.pdesc p{margin:0;padding:0 48px 14px 62px;color:var(--muted);font-size:.9rem;line-height:1.5}
.warn{margin:14px 2px 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--lime) 16%,transparent);border:1px solid color-mix(in srgb,var(--lime) 45%,transparent);color:var(--muted);font-size:.88rem;line-height:1.5}.warn b{color:var(--ink)}
#dlg.full{height:auto;top:0;bottom:0;padding:0 16px;overflow:hidden}
#dlg.full[open]{display:flex;flex-direction:column}
#dlg.full>.stk,#dlg.full>.eh.af{flex:none;position:static;margin:0;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--bg)}
#dlg.full .plist{flex:1;min-height:0;overflow-y:auto;max-height:none;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#dlg.full>.ef{flex:1;min-height:0;display:flex;flex-direction:column}
#dlg.full .ebody{flex:1;min-height:0;overflow-y:auto;max-height:none}
#dlg.full .efoot{position:static;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.fl textarea{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);width:100%;font:inherit;font-size:1rem;font-weight:500;color:var(--ink);resize:none;line-height:1.45}
.opt{font-weight:400;color:var(--muted)}
.icrow{display:flex;gap:10px;align-items:center}.icrow input{width:84px;flex:none;text-align:center}
.attach{flex:1;padding:13px 14px;border-radius:14px;border:1.5px dashed var(--line);background:none;color:var(--ink);font-weight:600}
.aprev{display:flex;align-items:center;gap:12px;margin-top:10px}.aprev img{width:48px;height:48px;border-radius:12px;object-fit:cover}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.setb .arr{animation:nudge 1.5s ease-in-out infinite}
.gear{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.nwr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyeb{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--hero-ink);display:grid;place-items:center;flex:none}
.gear:active,.eyeb:active{transform:scale(.88)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 14px}
.seg3 button{padding:12px;border-radius:14px;border:1.5px solid var(--line);background:none;color:var(--ink);font-weight:500}
.seg3 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.ab{color:var(--muted);margin:4px 0 18px}
.fb{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:.92rem;margin:0}.fb a{color:var(--pos);font-weight:700;word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rise .g polyline{stroke-dasharray:none;stroke-dashoffset:0}}
</style>

  function rg(k){var n=new Date(),a,b;
    if(P==='Day'){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()+k);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+1);}
    else if(P==='Week'){a=new Date(n.getFullYear(),n.getMonth(),n.getDate()-(n.getDay()+6)%7+7*k);b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7);}
    else if(P==='Month'){a=new Date(n.getFullYear(),n.getMonth()+k,1);b=new Date(a.getFullYear(),a.getMonth()+1,1);}
    else{a=new Date(n.getFullYear()+k,0,1);b=new Date(a.getFullYear()+1,0,1);}
    return [a.getTime(),b.getTime()];}
  function sum(r,neg){var t=0;evs.forEach(function(e){if(e.ts>=r[0]&&e.ts<r[1]&&(neg?e.amt<0:e.amt>0))t+=Math.abs(e.amt);});return t;}
  var cur=rg(ins.o),ex=sum(cur,true),inc=sum(cur,false),net=inc-ex,A=new Date(cur[0]),
  lab=P==='Day'?A.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}):P==='Week'?A.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' \u2013 '+new Date(cur[1]-1).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):P==='Month'?A.toLocaleDateString(undefined,{month:'long',year:'numeric'}):String(A.getFullYear());
  var g={},tot=exp?ex:inc,word=exp?'expenses':'income';
  evs.forEach(function(e){if(e.ts>=cur[0]&&e.ts<cur[1]&&(exp?e.amt<0:e.amt>0)){var k=e.t.cat||e.t.note||'No description';g[k]=(g[k]||0)+Math.abs(e.amt);}});
  var rows=Object.keys(g).map(function(k){return {k:k,v:g[k]};}).sort(function(x,y){return y.v-x.v;});
  var h='<div class="bar1"><h1>Insights</h1></div><div class="sel"><label class="pill"><span>Account</span><select data-act="ia" aria-label="Account"><option value="all">All accounts</option>'+accts.map(function(a){return '<option value="'+a.id+'"'+(a.id===ins.a?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select></label><label class="pill"><span>Period</span><select data-act="ip" aria-label="Period">'+['Day','Week','Month','Year'].map(function(p){return '<option'+(p===P?' selected':'')+'>'+p+'</option>';}).join('')+'</select></label></div>'
   +'<section class="card"><div class="dn"><button class="rb" data-act="ipv" aria-label="Previous">\u2039</button><b class="num">'+lab+'</b><button class="rb" data-act="inx" aria-label="Next"'+(ins.o>=0?' disabled':'')+'>\u203a</button></div><div class="st"><div class="xe">Expense<b class="num">'+m(ex)+'</b></div><div class="xi">Income<b class="num">'+m(inc)+'</b></div></div><p class="nb">Net balance<b class="num" style="color:'+(net>=0?'var(--gn)':'var(--rd)')+'">'+(net<0?'\u2212 ':'')+m(Math.abs(net))+'</b></p></section>'
   +'<div class="tg"><button class="te'+(exp?' on':'')+'" data-act="ik" data-k="exp">Expense</button><button class="ti'+(exp?'':' on')+'" data-act="ik" data-k="inc">Income</button></div>'
   +'<div style="--k:var('+(exp?'--rd':'--gn')+');--kt:var('+(exp?'--rdt':'--gnt')+')"><section class="tc"><div class="th">Total '+word+'<b class="num">'+m(tot)+'</b></div><div class="tb2">'
   +(rows.length?rows.map(function(r){var p=Math.round(r.v/tot*100);return '<div class="br"><div class="rw"><span>'+esc(r.k)+'</span><span class="num">'+m(r.v)+' <span class="tt">'+p+'%</span></span></div><i style="width:'+p+'%"></i></div>';}).join(''):'<p class="empty2">No '+word+' recorded</p>')
   +'</div></section><section class="tc"><div class="th" style="text-align:left">'+(exp?'Expense':'Income')+' trend</div><div class="tb2"><div id="tr"></div></div></section></div>'
   +'<section class="card"><h2>Growth</h2><div class="g" id="g2"></div></section>';
  app.innerHTML=h;graph(document.getElementById('g2'),list);
  var vals=[],labs=[];
  for(var i=N-1;i>=0;i--){var r=rg(ins.o-i),d=new Date(r[0]);vals.push(sum(r,exp));labs.push(P==='Day'?d.getDate():P==='Week'?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):P==='Month'?d.toLocaleDateString(undefined,{month:'short'}):d.getFullYear());}
  var el=document.getElementById('tr'),W=el.clientWidth||300,H=210,pl=58,pr=6,pt=8,pb=26,mx=Math.max.apply(null,vals),step=125;
  if(mx>0){var rough=mx/4,pw=Math.pow(10,Math.floor(Math.log10(rough)));step=[1,2,2.5,5,10].map(function(f){return f*pw;}).find(function(s){return s>=rough;});}
  var top=step*4,ph=H-pt-pb,slot=(W-pl-pr)/N,bw=Math.min(30,slot*0.55),svg='<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+(exp?'Expense':'Income')+' trend">';
  for(var t=0;t<=4;t++){var y=pt+ph*(1-t/4);svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke-dasharray="4 4" style="stroke:var(--line)"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+mp(step*t).replace(/\.\d+$/,'')+'</text>';}
  vals.forEach(function(v,j){var bh=v/top*ph,x=pl+slot*j+(slot-bw)/2;svg+='<rect x="'+x+'" y="'+(pt+ph-bh)+'" width="'+bw+'" height="'+bh+'" rx="6" style="fill:var(--k)" opacity="'+(j===N-1?1:0.55)+'"/><text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+labs[j]+'</text>';});
  el.innerHTML=svg+'</svg>';
}

  else if(a==='budget'){view='budget';go=true;render();window.scrollTo(0,0);}
  else if(a==='settings'){sheet(settingsSheet());}
  else if(a==='theme'){setTheme(d.t);sheet(settingsSheet());}

  else if(a==='avt'){acv=acv==='grid'?'list':'grid';try{localStorage.setItem('savings-acv',acv);}catch(x){}render();}

  else if(a==='bp'){bp=d.p;render();}
  else if(a==='blimit'){sheet(limSheet());}
  else if(a==='blrm'){BUD.lim[bp]=0;delete BUD.since[bp];save();dlg.close();render();}
  else if(a==='bcnew'){sheet(catBudSheet());}
  else if(a==='bcedit'){sheet(catBudSheet(d.id));}
  else if(a==='bcdel'){BUD.cat=BUD.cat.filter(function(x){return x.id!==d.id;});save();dlg.close();render();}
  else if(a==='breset0'){var cd2=document.getElementById('cdlg');cd2.innerHTML='<h3>Reset spent amounts?</h3><p class="cp">Spent will start again from zero for every budget. Your transactions and balances will not change.</p><div class="cb"><button type="button" class="btn alt" data-act="dno">Cancel</button><button type="button" class="btn alt del" data-act="breset">Reset</button></div>';cd2.showModal();}

  else if(a==='bsel'){T.bud=d.b;dlg.close();txr();}
  else if(a==='tclose'){tdlg.close();}
  else if(a==='ttab'){readT();var ok=(d.kk==='in')===(T.k==='in');T.k=d.kk;if(!ok){T.cat='';T.sub='';}txr();}
  else if(a==='tpick'){readT();T[d.w]=d.id;txr();}
  else if(a==='catopen'){readT();cx=-1;ce=false;csheet();}
  else if(a==='cpick'){T.cat=d.c;T.sub=d.s||'';dlg.close();txr();}
  else if(a==='cexp'){cx=cx===+d.i?-1:+d.i;csheet();}
  else if(a==='csub'){var sn=prompt('Subcategory name');if(sn&&sn.trim()){CATS[ckey()][+d.i].s.push(sn.trim());save();csheet();}}
  else if(a==='cnew'){var cn=prompt('Category name');if(cn&&cn.trim()){CATS[ckey()].push({n:cn.trim(),e:'\u{1F3F7}\uFE0F',s:[]});save();csheet();}}
  else if(a==='cedit'){ce=!ce;cx=-1;csheet();}

  else if(a==='newacct'){openPicker();}

  else if(a==='pinfo'){var sk=b.closest('.stk');sk.classList.toggle('info');b.setAttribute('aria-expanded',sk.classList.contains('info')?'true':'false');}

  else if(a==='dyes'){acc=get(d.id);accts=accts.filter(function(x){return x!==acc;});save();det=null;document.getElementById('cdlg').close();render();}
